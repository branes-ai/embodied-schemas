  - vapor_chamber
  - liquid_cooled
  - datacenter_direct_to_chip

source: "Intel 3 process brief (2024); Intel HC36 Granite Rapids deep dive; Intel ISSCC 2024 SRAM bitcell disclosure"
confidence: theoretical
last_updated: "2026-05-21"
notes: |
  Intel's second EUV node (after Intel 4) and final FinFET node
  before the Intel 18A GAA/RibbonFET transition. Mass production
  launched 2024. Hosts Granite Rapids (Xeon 6 P-core flagship) and
  Sierra Forest (Xeon 6 E-core efficient variant).

  Density positioning: between TSMC N5 (~145 Mtx/mm^2 HP) and TSMC
  N4P (~151 Mtx/mm^2 HP) for logic. SRAM density (~320 Mtx/mm^2 HD)
  is modestly better than Intel 7 but still well behind TSMC N3's
  ~410 Mtx/mm^2 HD -- the industry-wide SRAM scaling wall continues.

  Power numbers reflect the +18%% performance-per-watt improvement
  Intel claims for Intel 3 vs Intel 4 at the same Vdd. Nominal Vdd
  reduced to 0.70V (vs Intel 7's 0.75V) thanks to better transistor
  characteristics + tighter SRAM Vmin.

  Successor (Intel 18A): RibbonFET (Gate-All-Around) + PowerVia
  (backside power delivery) -- the first major architectural shift
  in Intel manufacturing since the FinFET introduction with 22nm in
  2011. Adds an additional ~15-20%% PPW. Future SKU YAMLs will
  reference a new ``intel_18a`` process node entry once available.
