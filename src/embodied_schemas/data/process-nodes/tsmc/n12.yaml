# TSMC N12 (12FFC / 12FFN) -- 16FF+ shrink with 12nm marketing label.
# Roughly 10-15% density and perf uplift over 16FF+.

id: tsmc_n12
foundry: tsmc
node_name: N12
node_nm: 12
transistor_topology: finfet
body_bias_supported: false
vt_options: [LVT, SVT, HVT]
nominal_vdd_v: 0.75

densities:
  hp_logic:
    circuit_class: hp_logic
    mtx_per_mm2: 26.0
    library_name: "12FFC HP"
    confidence: theoretical
    source: "TSMC 12FFC announcement 2017"
  balanced_logic:
    circuit_class: balanced_logic
    mtx_per_mm2: 33.0
    library_name: "12FFC Balanced"
    confidence: theoretical
    source: "Estimated 15% uplift over 16FF+ balanced"
  lp_logic:
    circuit_class: lp_logic
    mtx_per_mm2: 38.0
    library_name: "12FFC LP"
    confidence: theoretical
    source: "Estimated from 16FFC LP scaling"
  sram_hd:
    circuit_class: sram_hd
    mtx_per_mm2: 70.0
    library_name: "12FFC HD-SRAM"
    confidence: theoretical
    source: "Estimated 17% uplift over 16FF+ HD-SRAM"
  sram_hc:
    circuit_class: sram_hc
    mtx_per_mm2: 58.0
    confidence: theoretical
    source: "Estimated"
  analog:
    circuit_class: analog
    mtx_per_mm2: 4.5
    confidence: theoretical
    source: "Estimated from typical analog overhead"
  io:
    circuit_class: io
    mtx_per_mm2: 1.6
    confidence: theoretical
    source: "Pad ring estimate"

leakage_w_per_mm2:
  hp_logic: 0.022
  balanced_logic: 0.010
  lp_logic: 0.0042
  sram_hd: 0.0026
  sram_hc: 0.0034
  analog: 0.001
  io: 0.0005

energy_per_op_pj:
  hp_logic:fp32: 3.2
  hp_logic:bf16: 0.737
  hp_logic:fp16: 1.04
  hp_logic:int8: 0.40
  balanced_logic:fp32: 2.4
  balanced_logic:bf16: 0.552
  balanced_logic:fp16: 0.783
  balanced_logic:int8: 0.27
  balanced_logic:int4: 0.16

# The fp16 and bf16 entries are DERIVED from fp32 by embodied_schemas.fp_energy
# (Horowitz ISSCC 2014); a test holds them to it, so change fp32 and re-derive.
energy_per_op_sources:
  hp_logic:bf16: "DERIVED: hp_logic:fp32 x 0.230, BF16/FP32 FMA energy, BF16 fitted by significand width from Horowitz ISSCC 2014 Fig. 1.1.9 (doi:10.1109/ISSCC.2014.6757323); see embodied_schemas.fp_energy"
  hp_logic:fp16: "DERIVED: hp_logic:fp32 x 0.326, FP16/FP32 FMA energy from Horowitz ISSCC 2014 Fig. 1.1.9 (doi:10.1109/ISSCC.2014.6757323); see embodied_schemas.fp_energy"
  balanced_logic:bf16: "DERIVED: balanced_logic:fp32 x 0.230, BF16/FP32 FMA energy, BF16 fitted by significand width from Horowitz ISSCC 2014 Fig. 1.1.9 (doi:10.1109/ISSCC.2014.6757323); see embodied_schemas.fp_energy"
  balanced_logic:fp16: "DERIVED: balanced_logic:fp32 x 0.326, FP16/FP32 FMA energy from Horowitz ISSCC 2014 Fig. 1.1.9 (doi:10.1109/ISSCC.2014.6757323); see embodied_schemas.fp_energy"

em_j_max_by_temp_c:
  85: 1.4e6
  105: 9.0e5
  125: 6.0e5

routing_metal_width_um:
  hp_logic: 0.058
  balanced_logic: 0.058
  sram_hd: 0.044

m0_pitch_nm: 58
m1_pitch_nm: 58

cooling_compatible:
  - passive_heatsink_large
  - active_fan
  - vapor_chamber

source: "TSMC 12FFC announcement 2017; Wikichip"
confidence: theoretical
last_updated: "2026-05-09"
notes: |
  TSMC marketing-renamed 16FF+ shrink, ~15% density uplift. Often used for
  cost-down derivatives of 16nm designs. Mid-tier KPU SKUs (KPU-T256,
  KPU-T768 lower bin) can target this node.
