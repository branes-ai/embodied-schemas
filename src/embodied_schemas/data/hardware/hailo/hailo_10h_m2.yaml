# Hailo-10H M.2 AI Accelerator Module (Generative AI)
# Source: https://hailo.ai/products/ai-accelerators/hailo-10h-ai-accelerator/

id: hailo_10h_m2
name: Hailo-10H M.2 Generative AI Accelerator
vendor: hailo
model: Hailo-10H
hardware_type: npu

compute_paradigm: dataflow
optimized_for:
  - convolution
  - matrix_multiply
  - attention
  - int_quantized
  - int4

capabilities:
  peak_tops_int8: 20.0
  peak_tflops_fp16: 0.0
  peak_tflops_fp32: 0.0
  memory_gb: 8.0  # "equipped with 4GB or 8GB LPDDR4 memory"; the 8 GB SKU
  memory_type: LPDDR4
  memory_bandwidth_gbps: 34.1
  compute_units: 0
  tensor_cores: 0
  int4_support: true
  frameworks:
    - PyTorch
    - TensorFlow
    - TensorFlow Lite
    - ONNX
    - Keras
    - Transformers
  quantization_support:
    - int8
    - int4
  inference_runtimes:
    - Hailo Runtime
    - vLLM

physical:
  weight_grams: null                # no source gives a module mass
  dimensions_mm: [22.0, 80.0, 2.8]  # M.2 2280; 1.5 mm top + 0.8 mm PCB + 0.5 mm bottom
  form_factor: m2
  mounting: direct

environmental:
  operating_temp_c: [-40, 85]
  storage_temp_c: [-40, 85]

power:
  input_voltage_v: [3.135, 3.465]   # "3.3V ± 5%"
  power_modes:
    - name: "Typical"
      power_watts: 2.5
      description: "ResNet-50 224x224 @ 1015 FPS (datasheet)"
    - name: "Peak"
      power_watts: 8.25
      description: '"It consumes up to 8.25W" (datasheet)'
  tdp_watts: 8.25                   # no TDP stated; the datasheet maximum
  typical_power_watts: 2.5
  battery_compatible: true

interfaces:
  camera_csi: 0
  camera_usb: 0
  usb3: 0
  usb2: 0
  usb_c: 0
  pcie_lanes: 4
  pcie_gen: 3
  gpio: 0
  ethernet: null
  wifi: null
  bluetooth: null
  can_bus: 0
  i2c: 0
  spi: 0
  uart: 0
  hdmi: 0
  displayport: 0

software:
  os:
    - Linux (Ubuntu)
    - Windows
    - Android
  sdk: Hailo Dataflow Compiler
  sdk_version: "5.0"
  frameworks:
    - PyTorch
    - TensorFlow
    - ONNX
    - Transformers
  inference_runtimes:
    - Hailo Runtime
    - HailoRT
    - vLLM
  container_support: true

suitable_for:
  - edge
  - embedded
  - robotics
  - automotive
  - retail
  - telecommunications

target_applications:
  - vision
  - object_detection
  - nlp
  - llm
  - vlm
  - generative_ai

cost_usd: 229.0                     # UP Shop, 8 GB without heatsink, 2026-10
availability: limited
lifecycle_status: new

notes: |
  First edge AI accelerator with on-device generative AI.
  40 TOPS INT4 / 20 TOPS INT8 performance.
  Second-generation Hailo neural core architecture.
  Onboard 4-8GB LPDDR4X memory for LLM weights.
  Runs Llama2-7B at 10 tokens/second under 5W.
  Stable Diffusion 2.1 at 5 seconds/image.
  YOLOv11m on real-time 4K video.
  Supports LLMs, VLMs, and multi-modal AI.
  AEC-Q100 Grade 2 qualified for automotive.
  Figures are the 2280 Key M 8 GB module (HM22HB1C2FAE). Corrected 2026-10-03
  against the Key M ET datasheet Rev 1.0: previously 22x42x4 mm (2242), 12 g,
  5 W TDP, LPDDR4X and $199; the datasheet gives 22x80 mm, 1.5 + 0.5 mm
  components, up to 8.25 W, LPDDR4. No source gives a mass. Claims above
  this note are from the earlier product brief and are not re-verified.
datasheet_url: https://hailo.ai/hailo-files/hailo-10h-m-2-key-m-et-datasheet-en/
