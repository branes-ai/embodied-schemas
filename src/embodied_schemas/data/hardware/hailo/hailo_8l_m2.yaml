# Hailo-8L M.2 AI Accelerator Module (Entry-Level)
# Source: https://hailo.ai/products/ai-accelerators/hailo-8l-ai-accelerator-for-ai-light-applications/

id: hailo_8l_m2
name: Hailo-8L M.2 AI Accelerator
vendor: hailo
model: Hailo-8L
hardware_type: npu

compute_paradigm: dataflow
optimized_for:
  - convolution
  - matrix_multiply
  - int_quantized

capabilities:
  peak_tops_int8: 13.0
  peak_tflops_fp16: 0.0
  peak_tflops_fp32: 0.0
  memory_gb: 0.0
  memory_type: null
  memory_bandwidth_gbps: 0.0
  compute_units: 0
  tensor_cores: 0
  frameworks:
    - PyTorch
    - TensorFlow
    - TensorFlow Lite
    - ONNX
    - Keras
  quantization_support:
    - int8
    - int4
  inference_runtimes:
    - Hailo Runtime

physical:
  weight_grams: null                # no source gives a module mass
  dimensions_mm: [22.0, 80.0, 2.626]  # M.2 2280 B+M; "Height 2.626 mm" (±0.2)
  form_factor: m2
  mounting: direct

environmental:
  operating_temp_c: [-40, 85]
  storage_temp_c: [-40, 85]

power:
  input_voltage_v: [3.135, 3.465]   # "3.3V ± 5%"
  power_modes:
    - name: "Typical"
      power_watts: 1.9
      description: "ResNet-50 224x224 @ 433 FPS, 25 C (datasheet)"
    - name: "Light"
      power_watts: 1.4
      description: "MobileNet-SSD 300x300 @ 500 FPS, 25 C (datasheet)"
    - name: "Peak"
      power_watts: 6.6
      description: "Maximum power consumption (datasheet)"
  tdp_watts: 6.6                    # "Thermal design power (TDP) 6.6W"
  typical_power_watts: 1.9
  battery_compatible: true

interfaces:
  camera_csi: 0
  camera_usb: 0
  usb3: 0
  usb2: 0
  usb_c: 0
  pcie_lanes: 2                     # "PCIe Gen-3.0, 2-lanes" (Hailo-8L M.2 ET product brief, 3/25)
  pcie_gen: 3
  gpio: 0
  ethernet: null
  wifi: null
  bluetooth: null
  can_bus: 0
  i2c: 0
  spi: 0
  uart: 0
  hdmi: 0
  displayport: 0

software:
  os:
    - Linux (Ubuntu, Raspberry Pi OS)
    - Windows
  sdk: Hailo Dataflow Compiler
  sdk_version: "4.18"
  frameworks:
    - PyTorch
    - TensorFlow
    - ONNX
  inference_runtimes:
    - Hailo Runtime
    - HailoRT
  container_support: true

suitable_for:
  - edge
  - embedded
  - iot
  - smart_home

target_applications:
  - vision
  - object_detection

cost_usd: 89.0                      # UP Shop, 2280 B+M without heatsink, 2026-10
availability: widely_available
lifecycle_status: mature

notes: |
  Entry-level AI accelerator with 13 TOPS performance.
  Lower cost alternative to Hailo-8 for simpler workloads.
  Sold as M.2 2280 Key B+M (breakable to 2242) and 2230 Key A+E, PCIe Gen 3
  x2; these figures are the 2280 B+M module (HM21LB1C2LAE).
  Corrected 2026-10-03 against the Key B+M ET datasheet Rev 4.0: previously
  22x30x3.5 mm, 6 g, 3 W TDP, PCIe x1, $49 and "8.7 TOPS/W", none supported
  (it gives 6.6 W TDP; 13 TOPS at 1.9 W typical). No source gives a mass.
  Ideal for single-stream inference applications.
datasheet_url: https://hailo.ai/hailo-files/hailo-8l-m-2-key-b-m-et-datasheet-en/
product_url: https://hailo.ai/products/ai-accelerators/hailo-8l-m-2-ai-acceleration-module-for-ai-light-applications/
last_updated: "2025-12-31"
chip_id: hailo_8l_chip
