# Elma JetSys-5330 Rugged SFF AI System — NVIDIA Jetson AGX Orin
# Source: https://www.elma.com/en/news-events/news-releases/rugged-sff-ai-system-powered-by-nvidia-jetson-agx-orin-system-on-module
# Corrected 2026-10-08 from the Elma datasheet (03.04.26) via the source DB
# (data/sources/observations/rugged_systems.yaml, subject elma_jetsys_5330).
# The unified-catalog counterpart is data/compute_products/elma/jetsys_5330_orin.yaml.

id: elma_jetsys_5330_orin
name: Elma JetSys-5330 Rugged AI System (Jetson AGX Orin)
vendor: elma
model: JetSys-5330
hardware_type: gpu

compute_paradigm: simd
optimized_for:
  - matrix_multiply
  - convolution
  - attention
  - fp16
  - int_quantized

capabilities:
  peak_tops_int8: 275.0  # Jetson AGX Orin
  peak_tflops_fp16: null  # unsourced (legacy figure overstated)
  peak_tflops_fp32: 5.3  # Elma: "5.3 FP32 TFLOPs of CUDA computing power"
  memory_gb: 64.0
  memory_type: LPDDR5
  memory_bandwidth_gbps: 204.8
  compute_units: 2048  # CUDA cores
  tensor_cores: 64
  frameworks:
    - PyTorch
    - TensorFlow
    - ONNX
    - TensorRT
  quantization_support:
    - fp32
    - fp16
    - int8
  inference_runtimes:
    - TensorRT
    - DeepStream
    - Triton

physical:
  weight_grams: 7600.0  # Elma: 6.35 to 7.6 kg depending on configuration; max taken
  dimensions_mm: [343.5, 222.4, 112.5]  # Elma W x D x H, without the fan kit
  form_factor: standalone
  mounting: direct
  vita_standard: null  # SFF, not slot-based
  sosa_profile: null
  conduction_cooled: false
  conformal_coated: false

environmental:
  operating_temp_c: [-40, 55]  # Elma: -40 to 55 C or 71 C depending on configuration
  storage_temp_c: [-40, 85]  # Elma datasheet
  shock_g: 40.0  # Elma: operating shock 40 g; 11 ms
  ip_rating: IP67
  mil_std_810: "810G"
  mil_std_461: "461"  # revision not stated
  mil_std_704: "704F"
  mil_std_1275: "1275D"

power:
  input_voltage_v: [16.5, 50.0]  # Elma: 16.5 to 50 VDC, 28 VDC nominal
  power_modes:
    - name: "52W"
      power_watts: 52.0
      description: "Elma minimum system configuration (no per-mode clocks published)"
    - name: "130W"
      power_watts: 130.0
      gpu_freq_mhz: 1300
      description: "Elma maximum system configuration; GPU up to 1.3 GHz (64GB module)"
  tdp_watts: 130.0  # Elma: 52 W to 130 W depending on the configuration
  typical_power_watts: null  # unsourced
  battery_compatible: true

interfaces:
  usb3: 5  # 3x USB 3.2 Gen2 Type A + 2x USB 3.2 Type C
  usb_c: 2
  usb2: 4
  pcie_lanes: 8  # M.2 M-key x4 + M.2 B-key x1 + 3x mPCIe
  pcie_gen: null  # unsourced
  ethernet: 10gbps
  gpio: 9
  can_bus: 2
  uart: 3  # 2x RS-422 + 1x RS-232

software:
  os:
    - Ubuntu 22.04 (JetPack 6.x)
    - Ubuntu 20.04 (JetPack 5.x)
  sdk: JetPack
  sdk_version: "6.1"
  frameworks:
    - PyTorch
    - TensorFlow
    - ONNX Runtime
  inference_runtimes:
    - TensorRT
    - DeepStream
    - Triton Inference Server
  container_support: true

suitable_for:
  - uas
  - ugv
  - usv
  - edge
  - eoir
  - c5isr
target_applications:
  - vision
  - object_detection
  - segmentation
  - pose_estimation
  - multimodal
  - sensor_fusion

cost_usd: null  # Defense RFQ pricing
availability: limited
lifecycle_status: new

notes: |
  Rugged SFF edge AI system powered by NVIDIA Jetson AGX Orin 64GB SoM.
  275 TOPS AI performance (INT8).
  2048 CUDA cores, 64 Tensor Cores (Ampere architecture).
  12-core Arm Cortex-A78AE CPU.
  3x mini-PCIe slots (1x doubles as mSATA) + 2x M.2 (B-Key, M-Key).
  Multiple concurrent video pipelines.
  IP67 rated, MIL-STD-810G, MIL-HDBK-704F, MIL-STD-1275D.
  Optional fan kit. Weight 6.35 to 7.6 kg depending on configuration.
  Power range 52W to 130W depending on configuration.
  Corrected 2026-10-08 from the Elma datasheet: input voltage (was 10-36 V), operating and
  storage temperature, envelope (was unpublished), mass, FP32 (was 68.75 TFLOPS), interfaces;
  invented per-mode clocks and typical power dropped.
