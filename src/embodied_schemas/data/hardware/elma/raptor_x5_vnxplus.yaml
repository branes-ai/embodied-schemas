notes: |
  VNX+ (VITA 90) 5-slot rugged SFF computer.
  Primary SBC: Intel Core i7-1185GRE with 16GB LPDDR4x + 64GB NVMe.
  GPU option: NVIDIA Orin NX (16GB, 100 TOPS) with 120GB storage.
  Modular 5-slot 19mm VNX+ backplane.
  Air-assist cooling, -40°C to +71°C (configuration dependent).
  MIL-STD-810H, MIL-STD-461G, MIL-STD-704F/1275F qualified.
  28 VDC power input. System weight ~3.7 kg (8.1 lbs).
  About 70% smaller than equivalent 3U VPX system.
