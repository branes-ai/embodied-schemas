notes: |
  Industry's first 8-slot SOSA/VITA 90 aligned VNX+ development platform.
  8 slots: 6 payload (2x 400-pin SBC + 4x 320-pin) + 1 switch + 1 PSU.
  Backplane supports up to 10GHz signaling, 10GBASE-KX/40GBASE-KX4.
  PCIe Gen 4 routed expansion plane.
  Supports 19mm or 39mm modules, with/without wedgelocks and metal shells.
  320-pin variants support hybrid aperture connectors.
  1000BASE-T switch connecting all slots on utility segment.
  Full I/O from one 400-pin slot and one 320-pin slot.
  Power switchable from VITA 90.3 PS module or internal 110/200V PSU.
  Top-surface airflow cooling per slot.
