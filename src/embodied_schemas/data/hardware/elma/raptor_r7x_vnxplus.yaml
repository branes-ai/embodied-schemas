notes: |
  VNX+ (VITA 90) 7-slot rugged SFF computer.
  Primary SBC: Intel Core i7-1185GRE with 16GB LPDDR4x + 64GB NVMe.
  GPU option: NVIDIA Orin NX (16GB, 100 TOPS) with 240GB storage.
  Modular 7-slot 19mm VNX+ backplane.
  Two additional slots vs Raptor-X5 for FPGA, I/O, or second GPU.
  Air-assist cooling, -40°C to +71°C (configuration dependent).
  MIL-STD-810H, MIL-STD-461G, MIL-STD-704F/1275F qualified.
  28 VDC power input. System weight ~4.2 kg (9.25 lbs).
