# NVIDIA Jetson Orin Nano 8GB Developer Kit
# Source: https://developer.nvidia.com/embedded/jetson-orin-nano-developer-kit

id: nvidia_jetson_orin_nano_8gb
name: NVIDIA Jetson Orin Nano 8GB  # the module SKU (this entry previously described the Developer Kit)
vendor: nvidia
model: Jetson Orin Nano
hardware_type: gpu

compute_paradigm: simd
optimized_for:
  - matrix_multiply
  - convolution
  - int_quantized
  - fp16

capabilities:
  peak_tops_int8: 67.0  # sparse INT8 at MAXN_SUPER, NVIDIA datasheet
  peak_tflops_fp16: null  # unsourced (legacy figure overstated; FP32 up to ~13x)
  peak_tflops_fp32: null  # unsourced (legacy figure overstated; FP32 up to ~13x)
  memory_gb: 8.0  # NVIDIA datasheet
  memory_type: LPDDR5
  memory_bandwidth_gbps: 102.0  # at MAXN_SUPER, NVIDIA datasheet (68 base)
  compute_units: 1024  # CUDA cores, NVIDIA datasheet
  tensor_cores: 32  # NVIDIA datasheet
  frameworks:
    - PyTorch
    - TensorFlow
    - ONNX
    - TensorRT
  quantization_support:
    - fp32
    - fp16
    - int8
  inference_runtimes:
    - TensorRT
    - DeepStream
    - Triton

physical:
  weight_grams: 28.0  # NVIDIA datasheet module weight
  dimensions_mm: [69.6, 45.0, 8.0]  # L x W per NVIDIA; height unsourced (NVIDIA gives none)
  form_factor: som
  mounting: carrier_board

environmental:
  operating_temp_c: [-25, 80]
  storage_temp_c: [-40, 85]

power:
  input_voltage_v: [4.75, 5.25]  # VDD_IN 5 V module (NVIDIA DS-11105 v1.5; the 5-19 V range was the Developer Kit)
  power_modes:
    - name: "7W"
      power_watts: 7.0
      description: "NVIDIA power mode; NVIDIA publishes no clock for it"
    - name: "15W"
      power_watts: 15.0
      description: "NVIDIA power mode; NVIDIA publishes no clock for it"
    - name: "MAXN_SUPER"
      power_watts: 25.0
      gpu_freq_mhz: 1020
      description: "NVIDIA MAXN_SUPER (JetPack 6.2): max GPU clock at maximum module power"
  tdp_watts: 25.0  # NVIDIA maximum module power
  typical_power_watts: 10.0
  battery_compatible: true

interfaces:
  camera_csi: 2
  camera_usb: 2
  usb3: 4
  usb2: 2
  usb_c: 1
  pcie_lanes: 1
  pcie_gen: 3
  gpio: 40
  ethernet: 1gbps
  wifi: null
  bluetooth: null
  can_bus: 0
  i2c: 2
  spi: 2
  uart: 2
  hdmi: 1
  displayport: 1

software:
  os:
    - Ubuntu 22.04 (JetPack 6.x)
    - Ubuntu 20.04 (JetPack 5.x)
  sdk: JetPack
  sdk_version: "6.1"
  frameworks:
    - PyTorch
    - TensorFlow
    - ONNX Runtime
  inference_runtimes:
    - TensorRT
    - DeepStream
    - Triton Inference Server
  container_support: true

suitable_for:
  - edge
  - robotics
  - drone
  - embedded
target_applications:
  - vision
  - object_detection
  - segmentation
  - pose_estimation
  - nlp

cost_usd: 399.0  # NVIDIA 1KU list price, 2026-07
availability: widely_available
lifecycle_status: new

notes: |
  Entry-level Jetson Orin with 40 TOPS AI performance.
  6-core Arm Cortex-A78AE CPU (up to 1.5 GHz).
  1024 CUDA cores, 32 Tensor Cores (Ampere architecture).
  Supports NVIDIA Isaac, Riva, and TAO.
  Developer kit includes carrier board and power supply.
  Corrected 2026-10-08 from the source DB (data/sources/observations/jetson_modules.yaml, subject nvidia_jetson_orin_nano_8gb): module mass, dimensions, memory, CUDA/Tensor cores, sparse INT8, maximum power, power modes and 1KU price per NVIDIA's datasheets and FAQ. Per-mode GPU clocks are kept only where sourced; CPU clocks dropped and unsourced FP16/BF16/FP32 peaks nulled (legacy values were overstated).
datasheet_url: https://developer.nvidia.com/downloads/jetson-orin-nano-series-data-sheet
product_url: https://www.nvidia.com/en-us/autonomous-machines/embedded-systems/jetson-orin/
last_updated: "2026-10-08"
chip_id: nvidia_orin_nano_soc
gpu_id: nvidia_orin_nano_gpu_8gb_lpddr5
