# NVIDIA Jetson AGX Orin 32GB Module
# Source: https://www.nvidia.com/en-us/autonomous-machines/embedded-systems/jetson-orin/

id: nvidia_jetson_agx_orin_32gb
name: NVIDIA Jetson AGX Orin 32GB
vendor: nvidia
model: Jetson AGX Orin 32GB
hardware_type: gpu

compute_paradigm: simd
optimized_for:
  - matrix_multiply
  - convolution
  - int_quantized
  - fp16

capabilities:
  peak_tops_int8: 200.0  # sparse INT8, NVIDIA datasheet
  peak_tflops_fp16: null  # unsourced (legacy figure overstated; FP32 up to ~13x)
  peak_tflops_fp32: null  # unsourced (legacy figure overstated; FP32 up to ~13x)
  memory_gb: 32.0  # NVIDIA datasheet
  memory_type: LPDDR5
  memory_bandwidth_gbps: 204.8  # NVIDIA datasheet
  compute_units: 1792  # CUDA cores, NVIDIA datasheet
  tensor_cores: 56  # NVIDIA datasheet
  frameworks:
    - PyTorch
    - TensorFlow
    - ONNX
    - TensorRT
  quantization_support:
    - fp32
    - fp16
    - bf16
    - int8
  inference_runtimes:
    - TensorRT
    - DeepStream
    - Triton
    - Isaac ROS

physical:
  weight_grams: 306.0  # NVIDIA datasheet module weight
  dimensions_mm: [100.0, 87.0, 16.0]  # NVIDIA datasheet module size
  form_factor: som
  mounting: carrier_board

environmental:
  operating_temp_c: [-25, 80]
  storage_temp_c: [-40, 85]

power:
  input_voltage_v: [9.0, 20.0]
  power_modes:
    - name: "15W"
      power_watts: 15.0
      description: "NVIDIA power mode; NVIDIA publishes no clock for it"
    - name: "30W"
      power_watts: 30.0
      description: "NVIDIA power mode; NVIDIA publishes no clock for it"
    - name: "40W"
      power_watts: 40.0
      gpu_freq_mhz: 939
      description: "NVIDIA power mode (GPU clock NVIDIA)"
  tdp_watts: 40.0  # NVIDIA maximum module power
  typical_power_watts: 30.0
  battery_compatible: false

interfaces:
  camera_csi: 16
  camera_usb: 4
  usb3: 4
  usb2: 4
  usb_c: 1
  pcie_lanes: 16
  pcie_gen: 4
  gpio: 44
  ethernet: 10gbps
  wifi: null
  bluetooth: null
  can_bus: 3
  i2c: 4
  spi: 4
  uart: 4
  hdmi: 1
  displayport: 3

software:
  os:
    - Ubuntu 22.04 (JetPack 6.x)
    - Ubuntu 20.04 (JetPack 5.x)
  sdk: JetPack
  sdk_version: "6.1"
  frameworks:
    - PyTorch
    - TensorFlow
    - ONNX Runtime
  inference_runtimes:
    - TensorRT
    - DeepStream
    - Triton Inference Server
    - Isaac ROS
  container_support: true

suitable_for:
  - edge
  - robotics
  - autonomous_vehicles
  - amr
  - industrial

target_applications:
  - vision
  - object_detection
  - segmentation
  - pose_estimation
  - nlp

cost_usd: 1799.0  # NVIDIA 1KU list price, 2026-07
availability: widely_available
lifecycle_status: mature

notes: |
  High-performance Jetson Orin with 200 TOPS AI performance.
  8-core Arm Cortex-A78AE CPU (up to 2.0 GHz).
  1792 CUDA cores, 56 Tensor Cores (Ampere architecture).
  2x NVDLA v2.0 deep learning accelerators.
  32GB eMMC 5.1 onboard storage.
  Corrected 2026-10-08 from the source DB (data/sources/observations/jetson_modules.yaml, subject nvidia_jetson_agx_orin_32gb): module mass, dimensions, memory, CUDA/Tensor cores, sparse INT8, maximum power, power modes and 1KU price per NVIDIA's datasheets and FAQ. Per-mode GPU clocks are kept only where sourced; CPU clocks dropped and unsourced FP16/BF16/FP32 peaks nulled (legacy values were overstated).
datasheet_url: https://developer.nvidia.com/embedded/jetson-agx-orin
product_url: https://www.nvidia.com/en-us/autonomous-machines/embedded-systems/jetson-orin/
last_updated: "2026-10-08"
chip_id: nvidia_orin_soc
gpu_id: nvidia_orin_gpu_32gb_lpddr5
