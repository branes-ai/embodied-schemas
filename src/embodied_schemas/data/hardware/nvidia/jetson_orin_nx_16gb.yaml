# NVIDIA Jetson Orin NX 16GB Module
# Source: https://developer.nvidia.com/embedded/jetson-orin-nx-series

id: nvidia_jetson_orin_nx_16gb
name: NVIDIA Jetson Orin NX 16GB
vendor: nvidia
model: Jetson Orin NX 16GB
hardware_type: gpu

compute_paradigm: simd
optimized_for:
  - matrix_multiply
  - convolution
  - int_quantized
  - fp16

capabilities:
  peak_tops_int8: 157.0  # sparse INT8 at MAXN_SUPER, NVIDIA datasheet
  peak_tflops_fp16: null  # unsourced (legacy figure overstated; FP32 up to ~13x)
  peak_tflops_fp32: null  # unsourced (legacy figure overstated; FP32 up to ~13x)
  memory_gb: 16.0  # NVIDIA datasheet
  memory_type: LPDDR5
  memory_bandwidth_gbps: 102.0  # NVIDIA datasheet
  compute_units: 1024  # CUDA cores, NVIDIA datasheet
  tensor_cores: 32  # NVIDIA datasheet
  frameworks:
    - PyTorch
    - TensorFlow
    - ONNX
    - TensorRT
  quantization_support:
    - fp32
    - fp16
    - int8
  inference_runtimes:
    - TensorRT
    - DeepStream
    - Triton

physical:
  weight_grams: 28.0  # NVIDIA datasheet module weight
  dimensions_mm: [69.6, 45.0, 8.0]  # L x W per NVIDIA; height unsourced (NVIDIA gives none)
  form_factor: som
  mounting: carrier_board

environmental:
  operating_temp_c: [-25, 80]
  storage_temp_c: [-40, 85]

power:
  input_voltage_v: [5.0, 20.0]  # VDD_IN, NVIDIA DS-10712 v1.7; MAXN_SUPER needs >= 8 V
  power_modes:
    - name: "10W"
      power_watts: 10.0
      description: "NVIDIA power mode; NVIDIA publishes no clock for it"
    - name: "15W"
      power_watts: 15.0
      description: "NVIDIA power mode; NVIDIA publishes no clock for it"
    - name: "25W"
      power_watts: 25.0
      description: "NVIDIA power mode; NVIDIA publishes no clock for it"
    - name: "MAXN_SUPER"
      power_watts: 40.0
      gpu_freq_mhz: 1173
      description: "NVIDIA MAXN_SUPER (JetPack 6.2): max GPU clock at maximum module power; requires VDD_IN >= 8 V"
  tdp_watts: 40.0  # NVIDIA maximum module power
  typical_power_watts: 15.0
  battery_compatible: true

interfaces:
  camera_csi: 6
  camera_usb: 2
  usb3: 3
  usb2: 0
  usb_c: 0
  pcie_lanes: 8
  pcie_gen: 4
  gpio: 44
  ethernet: 10gbps
  wifi: null
  bluetooth: null
  can_bus: 3
  i2c: 4
  spi: 3
  uart: 3
  hdmi: 0
  displayport: 2

software:
  os:
    - Ubuntu 22.04 (JetPack 6.x)
    - Ubuntu 20.04 (JetPack 5.x)
  sdk: JetPack
  sdk_version: "6.1"
  frameworks:
    - PyTorch
    - TensorFlow
    - ONNX Runtime
  inference_runtimes:
    - TensorRT
    - DeepStream
    - Triton Inference Server
  container_support: true

suitable_for:
  - edge
  - robotics
  - drone
  - amr
  - embedded

target_applications:
  - vision
  - object_detection
  - segmentation
  - pose_estimation
  - nlp
  - multimodal

cost_usd: 999.0  # NVIDIA 1KU list price, 2026-07
availability: widely_available
lifecycle_status: new

notes: |
  High-performance Jetson Orin with 100 TOPS AI performance.
  8-core Arm Cortex-A78AE CPU (up to 2.0 GHz).
  2048 CUDA cores, 64 Tensor Cores (Ampere architecture).
  Pin-compatible with Jetson Xavier NX for easy upgrade.
  2x NVDLA engines for efficient inference.
  Corrected 2026-10-08 from the source DB (data/sources/observations/jetson_modules.yaml, subject nvidia_jetson_orin_nx_16gb): module mass, dimensions, memory, CUDA/Tensor cores, sparse INT8, maximum power, power modes and 1KU price per NVIDIA's datasheets and FAQ. Per-mode GPU clocks are kept only where sourced; CPU clocks dropped and unsourced FP16/BF16/FP32 peaks nulled (legacy values were overstated).
datasheet_url: https://developer.nvidia.com/downloads/jetson-orin-nx-series-data-sheet
product_url: https://www.nvidia.com/en-us/autonomous-machines/embedded-systems/jetson-orin/
last_updated: "2026-10-08"
chip_id: nvidia_orin_nx_soc
gpu_id: nvidia_orin_nx_gpu_16gb_lpddr5
