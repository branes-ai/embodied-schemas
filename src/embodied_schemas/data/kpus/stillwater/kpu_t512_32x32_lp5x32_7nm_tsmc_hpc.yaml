id: kpu_t512_32x32_lp5x32_7nm_tsmc_hpc
name: KPU T512 (32x32 PE, lpddr5x x32, TSMC N7 HPC)
vendor: stillwater
process_node_id: tsmc_n7
die:
  architecture: KPU Tile
  foundry: tsmc
  process_nm: 7
  process_name: N7
  transistors_billion: 12.813
  die_size_mm2: 113.2
  is_chiplet: false
  num_dies: 1
kpu_architecture:
  total_tiles: 512
  tiles:
  - tile_type: INT8-primary
    num_tiles: 358
    pe_array_rows: 32
    pe_array_cols: 32
    pe_circuit_class: balanced_logic
    ops_per_tile_per_clock:
      int8: 2048.0
      int4: 4096.0
      bf16: 1024.0
      fp16: 1024.0
    schedule_class: output_stationary
    pipeline_fill_cycles: 32
    pipeline_drain_cycles: 32
    notes: ''
  - tile_type: BF16-primary
    num_tiles: 102
    pe_array_rows: 32
    pe_array_cols: 32
    pe_circuit_class: balanced_logic
    ops_per_tile_per_clock:
      bf16: 1024.0
      fp16: 1024.0
      fp32: 512.0
      int8: 2048.0
    schedule_class: output_stationary
    pipeline_fill_cycles: 32
    pipeline_drain_cycles: 32
    notes: ''
  - tile_type: Matrix
    num_tiles: 52
    pe_array_rows: 32
    pe_array_cols: 32
    pe_circuit_class: hp_logic
    ops_per_tile_per_clock:
      int8: 2048.0
      bf16: 1024.0
      fp16: 1024.0
    schedule_class: output_stationary
    pipeline_fill_cycles: 32
    pipeline_drain_cycles: 32
    notes: ''
  noc:
    topology: mesh_2d
    mesh_rows: 32
    mesh_cols: 16
    flit_bytes: 16
    router_circuit_class: hp_logic
    bisection_bandwidth_gbps: 256.0
  memory:
    memory_type: lpddr5x
    memory_size_gb: 64.0
    memory_bus_bits: 512
    memory_bandwidth_gbps: 544.0
    memory_controllers: 32
    l3_kib_per_tile: 256
    l2_kib_per_tile: 32
    l1_kib_per_pe: 4
  multi_precision_alu:
  - int4
  - int8
  - bf16
  - fp32
silicon_bin:
  blocks:
  - name: pe_int8
    circuit_class: balanced_logic
    transistor_source:
      kind: per_pe
      per_unit_mtx: 0.006
      count_ref: tile.INT8-primary
    notes: ''
  - name: pe_bf16
    circuit_class: balanced_logic
    transistor_source:
      kind: per_pe
      per_unit_mtx: 0.012
      count_ref: tile.BF16-primary
    notes: ''
  - name: pe_matrix
    circuit_class: hp_logic
    transistor_source:
      kind: per_pe
      per_unit_mtx: 0.02
      count_ref: tile.Matrix
    notes: ''
  - name: l2_sram
    circuit_class: sram_hd
    transistor_source:
      kind: per_kib
      per_unit_mtx: 0.052
      count_ref: l2_total_kib
    notes: ''
  - name: l3_sram
    circuit_class: sram_hd
    transistor_source:
      kind: per_kib
      per_unit_mtx: 0.052
      count_ref: l3_total_kib
    notes: ''
  - name: noc_routers
    circuit_class: hp_logic
    transistor_source:
      kind: per_router
      per_unit_mtx: 0.8
      count_ref: noc
    notes: ''
  - name: memory_phys
    circuit_class: analog
    transistor_source:
      kind: per_controller
      per_unit_mtx: 6.0
      count_ref: memory
    notes: ''
  - name: io_pads
    circuit_class: io
    transistor_source:
      kind: fixed
      mtx: 8.0
    notes: ''
  - name: control_logic
    circuit_class: balanced_logic
    transistor_source:
