# Stillwater KPU-T256 -- high-performance edge / embodied AI accelerator.
# 256 heterogeneous tiles (179 INT8, 51 BF16, 26 Matrix), 32x32 PE arrays,
# TSMC N16. Targets autonomous vehicles, advanced robots, edge servers.
#
# Tile-microarchitecture is uniform with T64 / T128 (32x32 PE arrays,
# 2 ops/PE/clock for int8). Roadmap-friendly: total PEs scales linearly
# with tile count (T64=65,536, T128=131,072, T256=262,144), so cost /
# perf curves across the family are continuous.

id: stillwater_kpu_t256
name: "Stillwater KPU-T256"
vendor: stillwater

process_node_id: tsmc_n16

die:
  architecture: "KPU Tile"
  foundry: tsmc
  process_nm: 16
  process_name: "N16"
  transistors_billion: 6.42
  die_size_mm2: 188.0
  is_chiplet: false
  num_dies: 1

kpu_architecture:
  total_tiles: 256
  multi_precision_alu: [int4, int8, bf16, fp32]

  tiles:
    - tile_type: "INT8-primary"
      num_tiles: 179
      pe_array_rows: 32
      pe_array_cols: 32
      pe_circuit_class: balanced_logic
      ops_per_tile_per_clock:
        int8: 2048
        int4: 4096
        bf16: 1024
        fp16: 1024  # Same datapath as BF16 on KPU; same throughput
      schedule_class: output_stationary
      pipeline_fill_cycles: 32
      pipeline_drain_cycles: 32

    - tile_type: "BF16-primary"
      num_tiles: 51
      pe_array_rows: 32
      pe_array_cols: 32
      pe_circuit_class: balanced_logic
      ops_per_tile_per_clock:
        bf16: 1024
        fp16: 1024  # Same datapath as BF16 on KPU; same throughput
        fp32: 512
        int8: 2048
      schedule_class: output_stationary
      pipeline_fill_cycles: 32
      pipeline_drain_cycles: 32

    - tile_type: "Matrix"
      num_tiles: 26
      pe_array_rows: 32
      pe_array_cols: 32
      pe_circuit_class: hp_logic
      ops_per_tile_per_clock:
        int8: 2048
        bf16: 1024
        fp16: 1024  # Same datapath as BF16 on KPU; same throughput
      schedule_class: output_stationary
      pipeline_fill_cycles: 32
      pipeline_drain_cycles: 32

  noc:
    topology: mesh_2d
    mesh_rows: 16
    mesh_cols: 16
    flit_bytes: 16
    router_circuit_class: hp_logic
    bisection_bandwidth_gbps: 256.0

  memory:
    memory_type: lpddr5
    memory_size_gb: 32.0
    memory_bus_bits: 256
    memory_bandwidth_gbps: 256.0
    memory_controllers: 16
    l3_kib_per_tile: 256
    l2_kib_per_tile: 32
    l1_kib_per_pe: 4

silicon_bin:
  blocks:
    - name: pe_int8
      circuit_class: balanced_logic
      transistor_source:
        kind: per_pe
        per_unit_mtx: 0.006
        count_ref: "tile.INT8-primary"

    - name: pe_bf16
      circuit_class: balanced_logic
      transistor_source:
        kind: per_pe
        per_unit_mtx: 0.012
        count_ref: "tile.BF16-primary"

    - name: pe_matrix
      circuit_class: hp_logic
      transistor_source:
        kind: per_pe
        per_unit_mtx: 0.020
        count_ref: "tile.Matrix"

    # Per-PE L1 register state is rolled into pe_* block transistor
    # counts (part of PE area in domain-flow tiles).

    - name: l2_sram
      circuit_class: sram_hd
      transistor_source:
        kind: per_kib
        per_unit_mtx: 0.052
        count_ref: l2_total_kib

    - name: l3_sram
      circuit_class: sram_hd
      transistor_source:
        kind: per_kib
        per_unit_mtx: 0.052
        count_ref: l3_total_kib

    - name: noc_routers
      circuit_class: hp_logic
      transistor_source:
        kind: per_router
        per_unit_mtx: 0.8
        count_ref: noc

    - name: memory_phys
      circuit_class: analog
      transistor_source:
        kind: per_controller
        per_unit_mtx: 6.0
        count_ref: memory

    - name: io_pads
      circuit_class: io
      transistor_source:
        kind: fixed
        mtx: 8.0

    - name: control_logic
      circuit_class: balanced_logic
      transistor_source:
        kind: fixed
        mtx: 18.0

clocks:
  base_clock_mhz: 450.0
  boost_clock_mhz: 750.0

# Roll-up performance is REGENERATED by the kpu_sku_generator. Default
# profile is 30W at 600 MHz, Vdd 0.75V. Clocks dropped to Orin AGX-style
# operating points after Vdd was introduced to the thermal profiles.
#   INT8 ops/clock: 256 tiles x 2048 =   524,288 -> 314.6 TOPS @ 600 MHz
#   BF16 ops/clock: 256 tiles x 1024 =   262,144 -> 157.3 TFLOPS
#   FP32 ops/clock:  51 tiles x  512 =    26,112 ->  15.67 TFLOPS  (BF16-primary)
#   INT4 ops/clock: 179 tiles x 4096 =   733,184 -> 439.9 TOPS    (INT8-primary)
performance:
  int8_tops: 314.6
  bf16_tflops: 157.3
  fp32_tflops: 15.67
  int4_tops: 439.9

# TDP is DERIVED. Each profile picks (clock, Vdd); the model produces
# the resulting TDP. Orin-style DVFS spread across 15W/30W/50W.
power:
  tdp_watts: 30.0
  max_power_watts: 50.0
  min_power_watts: 15.0
  idle_power_watts: 1.79
  default_thermal_profile: "30W"
  thermal_profiles:
    - name: "15W"
      tdp_watts: 15.0
      clock_mhz: 450.0
      vdd_v: 0.60
      cooling_solution_id: passive_heatsink_large
      efficiency_factor_by_precision:
        int8: 0.68
        bf16: 0.63
        int4: 0.73
      tile_utilization_by_precision:
        int8: 0.93
        bf16: 0.88
        int4: 0.95
    - name: "30W"
      tdp_watts: 30.0
      clock_mhz: 600.0
      vdd_v: 0.75
      cooling_solution_id: active_fan
      efficiency_factor_by_precision:
        int8: 0.73
        bf16: 0.68
        int4: 0.78
      tile_utilization_by_precision:
        int8: 0.95
        bf16: 0.90
        int4: 0.97
    - name: "50W"
      tdp_watts: 50.0
      clock_mhz: 700.0
      vdd_v: 0.90
      cooling_solution_id: active_fan
      efficiency_factor_by_precision:
        int8: 0.78
        bf16: 0.73
        int4: 0.83
      tile_utilization_by_precision:
        int8: 0.97
        bf16: 0.92
        int4: 0.98

market:
  launch_date: "2026-Q2"
  launch_msrp_usd: 1092.0
  target_market: embodied
  product_family: "Stillwater KPU"
  model_tier: high
  is_available: false
  is_discontinued: false

notes: |
  High-performance KPU SKU for edge servers, autonomous vehicles, advanced
  drones. 256 tiles in a 16x16 grid, 32x32 PE arrays (262,144 PEs total).
  Tile microarchitecture is uniform with T64 / T128 so cost / perf curves
  across the entry / mid / high tier are continuous. 30W default with 15W
  and 50W profiles. TSMC N16, ~734 INT8 TOPS at the default profile.
last_updated: "2026-05-09"
