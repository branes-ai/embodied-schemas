# Stillwater KPU-T128 -- mid-range embodied AI accelerator.
# 128 heterogeneous tiles (89 INT8, 26 BF16, 13 Matrix), 32x32 PE arrays,
# TSMC N16. Targets autonomous robots, advanced edge.
#
# Per the M0.5 inverse-scaling story (kpu_t128.py): 32x32 PE arrays give
# T128 more total PEs (131,072) than T256's 20x20 arrangement (102,400).
# T128 trades absolute peak for higher per-tile utilization on smaller
# parallel workloads.

id: stillwater_kpu_t128
name: "Stillwater KPU-T128"
vendor: stillwater

process_node_id: tsmc_n16

die:
  architecture: "KPU Tile"
  foundry: tsmc
  process_nm: 16
  process_name: "N16"
  transistors_billion: 3.22
  die_size_mm2: 96.0
  is_chiplet: false
  num_dies: 1

kpu_architecture:
  total_tiles: 128
  multi_precision_alu: [int4, int8, bf16, fp32]

  tiles:
    - tile_type: "INT8-primary"
      num_tiles: 89
      pe_array_rows: 32
      pe_array_cols: 32
      pe_circuit_class: balanced_logic
      ops_per_tile_per_clock:
        int8: 2048
        int4: 4096
        bf16: 1024
      schedule_class: output_stationary
      pipeline_fill_cycles: 32
      pipeline_drain_cycles: 32

    - tile_type: "BF16-primary"
      num_tiles: 26
      pe_array_rows: 32
      pe_array_cols: 32
      pe_circuit_class: balanced_logic
      ops_per_tile_per_clock:
        bf16: 1024
        fp32: 512
        int8: 2048
      schedule_class: output_stationary
      pipeline_fill_cycles: 32
      pipeline_drain_cycles: 32

    - tile_type: "Matrix"
      num_tiles: 13
      pe_array_rows: 32
      pe_array_cols: 32
      pe_circuit_class: hp_logic
      ops_per_tile_per_clock:
        int8: 2048
        bf16: 1024
      schedule_class: output_stationary
      pipeline_fill_cycles: 32
      pipeline_drain_cycles: 32

  noc:
    topology: mesh_2d
    mesh_rows: 16
    mesh_cols: 8
    flit_bytes: 16
    router_circuit_class: hp_logic
    bisection_bandwidth_gbps: 96.0

  memory:
    memory_type: lpddr5
    memory_size_gb: 16.0
    memory_bus_bits: 128
    memory_bandwidth_gbps: 96.0
    memory_controllers: 8
    l3_kib_per_tile: 256
    l2_kib_per_tile: 32
    l1_kib_per_pe: 4

silicon_bin:
  blocks:
    - name: pe_int8
      circuit_class: balanced_logic
      transistor_source:
        kind: per_pe
        per_unit_mtx: 0.006
        count_ref: "tile.INT8-primary"

    - name: pe_bf16
      circuit_class: balanced_logic
      transistor_source:
        kind: per_pe
        per_unit_mtx: 0.012
        count_ref: "tile.BF16-primary"

    - name: pe_matrix
      circuit_class: hp_logic
      transistor_source:
        kind: per_pe
        per_unit_mtx: 0.020
        count_ref: "tile.Matrix"

    # Per-PE L1 register state is rolled into pe_* block transistor
    # counts (part of PE area in domain-flow tiles).

    - name: l2_sram
      circuit_class: sram_hd
      transistor_source:
        kind: per_kib
        per_unit_mtx: 0.052
        count_ref: l2_total_kib

    - name: l3_sram
      circuit_class: sram_hd
      transistor_source:
        kind: per_kib
        per_unit_mtx: 0.052
        count_ref: l3_total_kib

    - name: noc_routers
      circuit_class: hp_logic
      transistor_source:
        kind: per_router
        per_unit_mtx: 0.8
        count_ref: noc

    - name: memory_phys
      circuit_class: analog
      transistor_source:
        kind: per_controller
        per_unit_mtx: 6.0
        count_ref: memory

    - name: io_pads
      circuit_class: io
      transistor_source:
        kind: fixed
        mtx: 6.0

    - name: control_logic
      circuit_class: balanced_logic
      transistor_source:
        kind: fixed
        mtx: 12.0

clocks:
  base_clock_mhz: 900.0
  boost_clock_mhz: 1200.0

# Roll-up @ default 12W profile, 1.05 GHz. From tile_mix_consistency:
#   INT8 ops/clock: 128 tiles x 2048 = 262,144 -> 275.25 TOPS
#   BF16 ops/clock: 128 tiles x 1024 = 131,072 -> 137.63 TFLOPS
#   FP32 ops/clock:  26 tiles x  512 =  13,312 ->  13.98 TFLOPS  (BF16-primary)
#   INT4 ops/clock:  89 tiles x 4096 = 364,544 -> 382.77 TOPS    (INT8-primary)
performance:
  int8_tops: 275.0
  bf16_tflops: 138.0
  fp32_tflops: 14.0
  int4_tops: 383.0

power:
  tdp_watts: 12.0
  max_power_watts: 18.0
  min_power_watts: 6.0
  idle_power_watts: 3.0
  default_thermal_profile: "12W"
  thermal_profiles:
    # Cooling sized for PE-block hotspot density. Small heatsink isn't
    # adequate for the 32x32 PE arrays even at 6W.
    - name: "6W"
      tdp_watts: 6.0
      clock_mhz: 900.0
      cooling_solution_id: passive_heatsink_large
    - name: "12W"
      tdp_watts: 12.0
      clock_mhz: 1050.0
      cooling_solution_id: passive_heatsink_large
    - name: "18W"
      tdp_watts: 18.0
      clock_mhz: 1200.0
      cooling_solution_id: active_fan

market:
  launch_date: "2026-Q1"
  launch_msrp_usd: null
  target_market: embodied
  product_family: "Stillwater KPU"
  model_tier: mid
  is_available: false
  is_discontinued: false

notes: |
  Mid-range KPU SKU. M0.5 inverse-scaling: T128 keeps 32x32 PE arrays for
  more total PEs (131K) than T256's 20x20 layout (102K). 70/20/10 tile
  mix. Targets autonomous robots, advanced edge AI applications. TSMC N16,
  12W default with 6W and 18W profiles.
last_updated: "2026-05-09"
