      int8: 2048
      int4: 4096
      bf16: 1024
      fp16: 1024
    schedule_class: output_stationary
    pipeline_fill_cycles: 32
    pipeline_drain_cycles: 32
  - tile_type: BF16-primary
    num_tiles: 26
    pe_array_rows: 32
    pe_array_cols: 32
    pe_circuit_class: balanced_logic
    ops_per_tile_per_clock:
      bf16: 1024
      fp16: 1024
      fp32: 512
      int8: 2048
    schedule_class: output_stationary
    pipeline_fill_cycles: 32
    pipeline_drain_cycles: 32
  - tile_type: Matrix
    num_tiles: 13
    pe_array_rows: 32
    pe_array_cols: 32
    pe_circuit_class: hp_logic
    ops_per_tile_per_clock:
      int8: 2048
      bf16: 1024
      fp16: 1024
    schedule_class: output_stationary
    pipeline_fill_cycles: 32
    pipeline_drain_cycles: 32
  noc:
    topology: mesh_2d
    mesh_rows: 16
    mesh_cols: 8
    flit_bytes: 16
    router_circuit_class: hp_logic
    bisection_bandwidth_gbps: 96.0
  memory:
    memory_type: lpddr5
    memory_size_gb: 16.0
    memory_bus_bits: 128
    memory_bandwidth_gbps: 96.0
    memory_controllers: 8
    l3_kib_per_tile: 256
    l2_kib_per_tile: 32
    l1_kib_per_pe: 4
silicon_bin:
  blocks:
  - name: pe_int8
    circuit_class: balanced_logic
    transistor_source:
      kind: per_pe
      per_unit_mtx: 0.006
      count_ref: tile.INT8-primary
  - name: pe_bf16
    circuit_class: balanced_logic
    transistor_source:
      kind: per_pe
      per_unit_mtx: 0.012
      count_ref: tile.BF16-primary
  - name: pe_matrix
    circuit_class: hp_logic
    transistor_source:
      kind: per_pe
      per_unit_mtx: 0.02
      count_ref: tile.Matrix
