# AMD EPYC 9654 (Genoa, Zen 4, 96-core datacenter SKU).
#
# First chiplet CPU SKU in the data/compute_products/ catalog and the
# first AMD vendor entry. Migrates the legacy
# data/cpus/amd/epyc_9654_sp5.yaml (which carries flat operational
# specs but no die data) onto the v3+ ComputeProduct schema with
# CPUBlock + die-level transistor decomposition.
#
# Sprint #62 PR 1 (first of 5 AMD/Ampere datacenter CPU SKUs --
# see embodied-schemas#62 for the batch tracking issue and
# branes-ai/graphs#130 for the downstream PhysicalSpec backfill).
#
# Data sourced from:
#   - AMD EPYC 9004 series product brief (amd.com)
#   - AnandTech "Lighting the Fuse" Genoa launch coverage
#     (Nov 2022; specific die figures cited at launch)
#   - Wikichip Zen 4 microarchitecture page
#   - graphs/src/graphs/hardware/models/datacenter/amd_epyc_9654.py
#     (well-validated graphs mapper -- the migration source; provides
#     the ops/clock, energy, and cluster-config ground truth)
#
# Confidence: theoretical.
#   - Operational specs (cores, threads, cache, TDP, memory, clocks)
#     are AMD-published datasheet values.
#   - Per-CCD die area (66 mm^2) and transistor count (6.57 billion)
#     are AMD-disclosed values from the Genoa launch.
#   - IOD die area (~397 mm^2) is the value cited by multiple launch
#     reviews; AMD did not publish the IOD's transistor count, so
#     the ~12 billion figure is an estimate scaled from the Milan IOD
#     (Rome/Milan IOD was ~8.34 billion at 12nm GF; the larger Genoa
#     IOD on TSMC N6 adds DDR5 PHY + PCIe Gen5 + larger Infinity
#     Fabric, hence the ~+50% scaling).
#   - Energy coefficients come from the graphs hand-coded factory,
#     which itself is calibrated against published AVX-512 / Zen 4
#     power envelopes.
#
# Chiplet modeling note (KNOWN SCHEMA LIMITATION):
#   - The schema's AnyBlock discriminator union (KPU/GPU/CPU/NPU/CGRA/
#     DPU/TPU/DSP) does not yet have an IOBlock or MemoryBlock kind.
#     The Genoa IOD is an I/O die with no compute cores -- its
#     constituent functions (memory controllers, PCIe PHY, Infinity
#     Fabric routers, security processor) don't fit any current
#     Block kind.
#   - Since Die.blocks[] requires min_length=1 and no current Block
#     can describe the IOD, this YAML models EPYC 9654 as a SINGLE
#     VIRTUAL DIE whose silicon_bin entries decompose across the
#     12 CCDs + IOD. The headline PhysicalSpec values (die_size_mm2,
#     transistors_billion, packaging.num_dies, is_chiplet) are still
#     accurate; the per-die process_node distinction (CCD on N5, IOD
#     on N6) is documented in this comment and the YAML notes but
#     not visible in dies[].
#   - When the schema adds an IOBlock kind (open follow-up under
#     embodied-schemas#62), this YAML should be re-authored with 12
#     CCD dies + 1 IOD die. The PhysicalSpec sum semantics in the
#     downstream graphs loader already handle multi-die products
#     correctly.
#
# Out of scope for this YAML:
#   - Per-CCD ClockDomain (Zen 4 runs CCDs at slightly different
#     boosts; modeled as a single chip-wide profile here).
#   - 3D V-Cache variant (EPYC 9684X / 9384X) -- separate follow-up.
#   - EPYC 9754 (Bergamo / Zen 4c) -- separate SKU in the same batch.
#   - SEV-SNP confidential computing modes (security tier, not
#     compute path).

id: amd_epyc_9654_sp5
name: AMD EPYC 9654
vendor: amd
kind: chip
packaging:
  kind: chiplet
  num_dies: 13          # 12 Zen 4 CCDs + 1 Genoa IOD
  package_type: sp5     # AMD socket SP5 (LGA-6096, datacenter)

lifecycle: production

dies:
- die_id: epyc_9654_virtual_die
  die_role: compute
  # Primary process node = CCDs (TSMC N5). The IOD is on TSMC N6 --
  # captured in silicon_bin entry notes but not visible at the Die
  # level until the schema adds per-block process_node refs.
  process_node_id: tsmc_n5
  # Total package silicon area: 12 * 66 mm^2 (CCDs) + 397 mm^2 (IOD)
  # = 1189 mm^2 total.
  die_size_mm2: 1189.0
  # 12 * 6.57 B (CCDs, AMD-disclosed) + ~12 B (IOD estimate) = 90.84 B.
  transistors_billion: 90.84
  silicon_bin:
    blocks:
    # -------------------------------------------------------------------
    # 12 Zen 4 CCDs on TSMC N5. Each CCD: 8 cores + 32 MB L3 + L2 +
    # L1 + Infinity Fabric On-Package (IFOP) link. AMD disclosed
    # 6.57 billion transistors per CCD at the Genoa launch.
    # Total: 12 * 6.57 = 78.84 B for all CCDs.
    - name: zen4_ccds
      circuit_class: hp_logic
      transistor_source:
        kind: fixed
        mtx: 78840.0
      notes: 12x Zen 4 CCDs on TSMC N5 @ 6.57 B tx each (AMD-disclosed). Each CCD = 8 cores + 32 MB L3 + IFOP link.
    # -------------------------------------------------------------------
    # 12 CCDs' L1/L2/L3 caches (already counted in zen4_ccds total
    # transistors above -- this is informational only, no double-count).
    # Listed as zero so the silicon_bin sum matches transistors_billion.
    - name: ccd_caches_informational
      circuit_class: sram_hd
      transistor_source:
        kind: fixed
        mtx: 0.0
      notes: Per-CCD caches (32 KB L1D + 32 KB L1I + 1 MB L2 per core + 32 MB shared L3 per CCD) -- included in zen4_ccds total, not double-counted here.
    # -------------------------------------------------------------------
    # Genoa IOD on TSMC N6. Contains: 12 DDR5 memory controllers,
    # 128 PCIe Gen5 lanes (4 IO hubs), 4 G-link to other sockets
    # (8 G-link if 2P), Infinity Fabric routers, AMD security
    # processor (PSP). Estimated ~12 billion transistors total
    # (AMD did not publish; scaled +50% from Rome/Milan IOD's
    # ~8 B at 12nm GF to account for DDR5 PHY + PCIe Gen5 + larger IF).
    - name: genoa_iod
      circuit_class: balanced_logic
      transistor_source:
        kind: fixed
        mtx: 12000.0
      notes: Genoa IOD on TSMC N6 @ ~397 mm^2 -- 12x DDR5 IMC + 128 PCIe Gen5 + 4x G-link + Infinity Fabric + PSP. ~12 B tx estimate (AMD did not publish).
  clocks:
    base_clock_mhz: 2400.0
    boost_clock_mhz: 3700.0
  blocks:
  - kind: cpu
    total_effective_cores: 96
    simd_width_lanes: 16        # 512-bit AVX-512 = 16 FP32 lanes
    multi_precision_alu:
    - fp64
    - fp32
    - fp16
    - bf16
    - int8
    - int4
    core_clusters:
    # -------------------------------------------------------------------
    # Single homogeneous cluster of 96 Zen 4 cores. AMD doesn't expose
    # per-CCD clusters to the OS -- the OS sees one flat 96-core / 192-
    # thread topology. AVX-512 is implemented as a double-pumped 256-bit
    # datapath (Zen 4's "AVX-512 lite"); peak ops/cycle still matches
    # full AVX-512 because instructions execute over 2 cycles.
    - cluster_kind: homogeneous
      num_cores: 96
      smt_threads: 2
      aggregate_weight: 1.0
      compute_fabrics:
      - isa_extension: avx512_bf16
        circuit_class: hp_logic
        # Per-core peak ops/clock. Zen 4 AVX-512 datapath:
        #   FP32: 16 ops/clock (2 256-bit FMA pipes, each 8 lanes * 2 ops/lane
        #         FMA -- but double-pumped so 1 512-bit FMA every other cycle).
        #         The graphs hand-coded model uses 8 effective ops/cycle.
        #   INT8: 64 ops/clock via AVX-512_VNNI VPDPBUSD (4 INT8 ops/lane
        #         * 16 lanes).
        #   BF16: 32 ops/clock via AVX-512_BF16 VDPBF16PS.
        ops_per_core_per_clock:
          fp64: 8
          fp32: 16
          fp16: 32   # half-rate via FP16 conversions, no native AVX-512_FP16
          bf16: 32   # AVX-512_BF16 VDPBF16PS
          int8: 64   # AVX-512_VNNI
          int4: 128  # packed-INT4 via VPDPBUSD lanewise
        # Energy from the graphs hand-coded factory at 1.35 pJ for the
        # AVX-512 (SIMD-packed) FMA datapath @ TSMC N5.
        energy_per_flop_fp32_pj: 1.35
        energy_scaling:
          fp64: 2.0
          fp32: 1.0
          fp16: 0.55
          bf16: 0.55
          int8: 0.30
          int4: 0.18
      l1_kib_per_core: 32         # 32 KB L1D per core (Zen 4)
      l2_layout: private_per_core
      l2_kib_per_core: 1024       # 1 MB private L2 per core
      l2_kib_shared: 0
    memory:
      memory_type: ddr5
      memory_size_gb: 6144.0     # 12 channels * 512 GB per slot, max
      memory_bus_bits: 768       # 12 channels * 64 bits/channel
      memory_bandwidth_gbps: 460.8  # 12 * 4800 MT/s * 8 B = 460.8 GB/s
      memory_controllers: 12
      l3_present: true
      l3_total_kib: 393216       # 384 MB shared L3 LLC (32 MB per CCD * 12 CCDs)
      l4_present: false
      l4_total_kib: 0
      l4_kind: ''
      coherence_protocol: directory_mesi  # AMD's MOESI-derived directory coherence over Infinity Fabric
      read_energy_pj_per_byte: 28.0
      write_energy_pj_per_byte: 32.0
    noc:
      topology: io_die_plus_ccd
      bisection_bandwidth_gbps: 2048.0   # Infinity Fabric IFOP per-CCD * 12 CCDs (approximate)
      unit_count: 12                     # CCD count, per OnDieFabric base field rename
      flit_size_bytes: 32
      hop_latency_ns: 5.0                # IFOP cross-CCD via IOD round-trip
      pj_per_flit_per_hop: 18.0
      routing_distance_factor: 2.0       # Two-hop typical (CCD -> IOD -> CCD)
    simd_efficiency_by_op_kind:
      elementwise: 0.90
      matrix: 0.75
      default: 0.65
    min_occupancy: 0.5
    max_concurrent_threads: 192   # 96 cores * 2 SMT threads
    wave_quantization: 1
  interconnects: []

# Chip-level performance roll-up at the 360W TDP profile, all-core
# boost of 3.55 GHz:
#   FP32: 96 cores * 16 ops/clk * 3.55e9 = 5.45 TFLOPS
#   INT8: 96 cores * 64 ops/clk * 3.55e9 = 21.82 TOPS
#   BF16: 96 cores * 32 ops/clk * 3.55e9 = 10.91 TFLOPS
# The legacy graphs factory derives slightly lower numbers from the
# 2.4 GHz base clock; the all-core sustained boost is the better
# operating-point match for AI workloads.
performance:
  fp32_tflops: 5.45
  bf16_tflops: 10.91
  int8_tops: 21.82
  int4_tops: 43.64

power:
  tdp_watts: 360.0
  max_power_watts: 400.0     # configurable_tdp_up: 400W (PPT)
  min_power_watts: 320.0     # configurable_tdp_down: 320W
  idle_power_watts: 90.0     # typical datacenter CPU idle
  default_thermal_profile: 360W-default
  thermal_profiles:
  - name: 360W-default
    tdp_watts: 360.0
    clock_mhz: 3550.0        # all-core sustained boost
    cooling_solution_id: datacenter_air
    efficiency_factor_by_precision:
      fp32: 0.45
      fp16: 0.30
      bf16: 0.50
      int8: 0.55
    vdd_v: 1.10

market:
  launch_date: '2022-11-10'
  launch_msrp_usd: 11805.0
  target_market: datacenter
  product_family: EPYC
  model_tier: datacenter
  is_available: true

confidence: theoretical
notes: >
  AMD EPYC 9654 -- first AMD chiplet SKU in the v3+ ComputeProduct
  catalog. Genoa (4th-gen EPYC), 96 Zen 4 cores in 12 CCDs on TSMC
  N5, paired with a single Genoa IOD on TSMC N6. SP5 socket
  (LGA-6096) for 1P/2P datacenter platforms. AVX-512 + AVX-512_BF16
  + AVX-512_VNNI implemented as a double-pumped 256-bit datapath
  ("Zen 4 AVX-512 lite") -- peak ops/cycle matches discrete AVX-512
  but at half the issue rate, and at ~1.35 pJ/FMA AVX-512 power
  envelope.

  Memory: 12-channel DDR5-4800, 460.8 GB/s peak, max 6 TiB per
  socket. L3 LLC 384 MB total, distributed 32 MB per CCD (not a
  unified pool). 128 PCIe Gen5 lanes + 4 G-link (per-socket, 8 in 2P
  configurations). CXL 1.1 over PCIe-physical-layer. AMD SEV-SNP
  for confidential computing (security-tier, not modeled here).

  Power: 360W default TDP (PL1-equivalent), configurable 320-400W
  (cTDP). Datacenter air cooling assumed.

  CHIPLET MODELING (see header comment): EPYC 9654 is physically 13
  dies (12 CCDs + 1 IOD on a different process node). The schema
  currently lacks an IOBlock / MemoryBlock kind to represent the
  IOD, so this YAML uses a single virtual die with the silicon_bin
  decomposing across CCDs and IOD. packaging.num_dies=13 and
  packaging.kind=chiplet remain accurate; the dies[] list is the
  approximation. Re-author once embodied-schemas adds an IOBlock
  kind.
last_updated: '2026-05-20'
