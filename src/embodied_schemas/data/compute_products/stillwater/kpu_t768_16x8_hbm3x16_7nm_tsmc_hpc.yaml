id: kpu_t768_16x8_hbm3x16_7nm_tsmc_hpc
name: Stillwater KPU-T768
vendor: stillwater
kind: chip
packaging:
  kind: monolithic
  num_dies: 1
  package_type: monolithic
lifecycle: production
dies:
- die_id: kpu_compute
  die_role: compute
  process_node_id: tsmc_n7
  die_size_mm2: 330.0
  transistors_billion: 13.14
  silicon_bin:
    blocks:
    - name: pe_int8
      circuit_class: balanced_logic
      transistor_source:
        kind: per_pe
        per_unit_mtx: 0.02
        count_ref: tile.INT8-primary
      notes: 'INT8 PE @ N7 with per-PE register state rolled in. ~20K

        transistors per PE (datacenter PEs carry larger weight buffers

        than edge SKUs).

        '
    - name: pe_bf16
      circuit_class: balanced_logic
      transistor_source:
        kind: per_pe
        per_unit_mtx: 0.03
        count_ref: tile.BF16-primary
      notes: ''
    - name: pe_matrix
      circuit_class: hp_logic
      transistor_source:
        kind: per_pe
        per_unit_mtx: 0.3
        count_ref: tile.Matrix
      notes: 'Systolic Matrix cell: 64 MAC lanes (8-bit multiplier + 32-bit

        accumulator + registers, ~4.7K transistors each) plus weight

        registers and input forwarding. ~300K transistors per cell. L1 and

        L2 are the tile''s own local_memory, not in this block.

        '
    - name: l1_sram
      circuit_class: sram_hd
      transistor_source:
        kind: per_kib
        per_unit_mtx: 0.052
        count_ref: l1_total_kib
      notes: Fabric-edge stream storage, per compute tile
    - name: l2_sram
      circuit_class: sram_hd
      transistor_source:
        kind: per_kib
        per_unit_mtx: 0.022
        count_ref: l2_total_kib
      notes: ''
    - name: l3_sram
      circuit_class: sram_hd
      transistor_source:
        kind: per_kib
        per_unit_mtx: 0.022
        count_ref: l3_total_kib
      notes: 'Distributed L3: 256 KiB x 768 = 192 MiB'
    - name: noc_routers
      circuit_class: hp_logic
      transistor_source:
        kind: per_router
        per_unit_mtx: 4.0
        count_ref: noc
      notes: 32-byte flit routers with deep buffers for datacenter NoC
    - name: memory_phys
      circuit_class: analog
      transistor_source:
        kind: per_controller
        per_unit_mtx: 200.0
        count_ref: memory
      notes: HBM3 PHY is heavy -- ~200 Mtx per controller, dominates analog area
    - name: io_pads
      circuit_class: io
      transistor_source:
        kind: fixed
        mtx: 60.0
      notes: PCIe Gen5 x16 + power management + sideband
    - name: control_logic
      circuit_class: balanced_logic
      transistor_source:
        kind: fixed
        mtx: 100.0
      notes: Top-level scheduler, virtualization, multi-tenancy
  clocks:
    base_clock_mhz: 1000.0
    boost_clock_mhz: 1600.0
  blocks:
  - kind: kpu
    total_tiles: 768
    multi_precision_alu:
    - int4
    - int8
    - bf16
    - fp32
    tiles:
    - tile_type: INT8-primary
      num_tiles: 537
      pe_array_rows: 16
      pe_array_cols: 8
      pe_circuit_class: balanced_logic
      ops_per_tile_per_clock:
        int8: 512.0
        int4: 1024.0
        bf16: 256.0
        fp16: 256.0
      schedule_class: output_stationary
      pipeline_fill_cycles: 16
      pipeline_drain_cycles: 16
      notes: ''
    - tile_type: BF16-primary
      num_tiles: 154
      pe_array_rows: 16
      pe_array_cols: 8
      pe_circuit_class: balanced_logic
      ops_per_tile_per_clock:
        bf16: 256.0
        fp16: 256.0
        fp32: 128.0
        int8: 512.0
      schedule_class: output_stationary
      pipeline_fill_cycles: 16
      pipeline_drain_cycles: 16
      notes: ''
    # Matrix, migrated to the systolic tile kind (graphs#268 D8). The
    # throughput is the legacy SKU's, unchanged: 8192 INT8 ops per clock
    # over 8x8 cells is 128 ops per cell, which a systolic tile states as
    # its mechanism -- 64 MAC lanes per cell at 2 ops each (32 lanes in the
    # 16-bit float modes). That is consistent with the 0.3 Mtx per cell the
    # pe_matrix block budgets: ~4.7K transistors per lane for an 8-bit
    # multiplier, a 32-bit accumulator adder and its registers.
    #
    # Energy is deliberately not declared, so each op is charged the node's
    # hp_logic anchor exactly as the pe_fabric tile was. A systolic discount
    # (systolic_int8_ws derives 0.65x) would be its own model change with a
    # Vdd re-tune.
    #
    # The tile states its L1 and L2 because a systolic tile does not inherit
    # the chip-level figures: the same 4 KiB fabric-edge stream storage and
    # 32 KiB reformatting buffer every other compute tile of this SKU has.
    - tile_kind: systolic
      tile_type: Matrix
      num_tiles: 77
      array_rows: 8
      array_cols: 8
      dataflow: weight_stationary
      circuit_class: hp_logic
      mac:
        unit_id: mac
        op: mac
        modes:
        - {operand_format: int8, accumulate_format: int32, lanes: 64}
        - {operand_format: bf16, lanes: 32}
        - {operand_format: fp16, lanes: 32}
      supported_kernels: [gemm, conv2d, attention]
      local_memory:
      - {level: l1, kib: 4}
      - {level: l2, kib: 32}
      notes: 'Tensor-core-style weight-stationary systolic array for large-matrix

        LLM inference: 64 MAC lanes per cell give 128 INT8 ops per cell per

        clock (vs 2 for a single-MAC cell).

        '
    noc:
      topology: mesh_2d
      mesh_rows: 32
      mesh_cols: 24
      flit_bytes: 32
      router_circuit_class: hp_logic
      bisection_bandwidth_gbps: 1024.0
    memory:
      memory_type: hbm3
      memory_size_gb: 64.0
      memory_bus_bits: 4096
      memory_bandwidth_gbps: 1638.0
      memory_controllers: 8
      l3_kib_per_tile: 256
      l2_kib_per_tile: 32
      l1_kib_per_tile: 4
    # Default per-cluster DVFS partition (graphs#268 F2): one domain per
    # k x k block of compute sites with its own rail and PLL, plus the
    # uncore. No operating points: every cluster runs at its profile's
    # Vdd and clock, so TDP, performance and area are unchanged.
    power_domains:
    - domain_id: c_0_0
      kind: cluster
      site_ranges:
      - {row_min: 0, row_max: 3, col_min: 0, col_max: 3}
      rail_id: vdd_c_0_0
      clock_domain_id: clk_c_0_0
    - domain_id: c_0_1
