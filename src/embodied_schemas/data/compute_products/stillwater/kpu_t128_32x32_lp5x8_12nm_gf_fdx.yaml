id: kpu_t128_32x32_lp5x8_12nm_gf_fdx
name: KPU T128 (32x32 PE, lpddr5x x8, 12nm FDX, energy-efficient)
vendor: stillwater
kind: chip
packaging:
  kind: monolithic
  num_dies: 1
  package_type: monolithic
lifecycle: production
dies:
- die_id: kpu_compute
  die_role: compute
  process_node_id: gf_12fdx
  die_size_mm2: 110.0
  transistors_billion: 3.226
  silicon_bin:
    blocks:
    - name: pe_int8
      circuit_class: balanced_logic
      transistor_source:
        kind: per_pe
        per_unit_mtx: 0.006
        count_ref: tile.INT8-primary
      notes: ''
    - name: pe_bf16
      circuit_class: balanced_logic
      transistor_source:
        kind: per_pe
        per_unit_mtx: 0.012
        count_ref: tile.BF16-primary
      notes: ''
    - name: pe_matrix
      circuit_class: hp_logic
      transistor_source:
        kind: per_pe
        per_unit_mtx: 0.02
        count_ref: tile.Matrix
      notes: ''
    - name: l1_sram
      circuit_class: sram_hd
      transistor_source:
        kind: per_kib
        per_unit_mtx: 0.052
        count_ref: l1_total_kib
      notes: Fabric-edge stream storage, per compute tile
    - name: l2_sram
      circuit_class: sram_hd
      transistor_source:
        kind: per_kib
        per_unit_mtx: 0.052
        count_ref: l2_total_kib
      notes: ''
    - name: l3_sram
      circuit_class: sram_hd
      transistor_source:
        kind: per_kib
        per_unit_mtx: 0.052
        count_ref: l3_total_kib
      notes: ''
    - name: noc_routers
      circuit_class: hp_logic
      transistor_source:
        kind: per_router
        per_unit_mtx: 0.8
        count_ref: noc
      notes: ''
    - name: memory_phys
      circuit_class: analog
      transistor_source:
        kind: per_controller
        per_unit_mtx: 6.0
        count_ref: memory
      notes: ''
    - name: io_pads
      circuit_class: io
      transistor_source:
        kind: fixed
        mtx: 8.0
      notes: ''
    - name: control_logic
      circuit_class: balanced_logic
      transistor_source:
        kind: fixed
        mtx: 18.0
      notes: ''
  clocks:
    base_clock_mhz: 450.0
    boost_clock_mhz: 750.0
  blocks:
  - kind: kpu
    total_tiles: 128
    multi_precision_alu:
    - int4
    - int8
    - bf16
    - fp32
    tiles:
    - tile_type: INT8-primary
      num_tiles: 89
      pe_array_rows: 32
      pe_array_cols: 32
      pe_circuit_class: balanced_logic
      ops_per_tile_per_clock:
        int8: 2048.0
        int4: 4096.0
        bf16: 1024.0
        fp16: 1024.0
      schedule_class: output_stationary
      pipeline_fill_cycles: 32
      pipeline_drain_cycles: 32
      notes: ''
    - tile_type: BF16-primary
      num_tiles: 26
      pe_array_rows: 32
      pe_array_cols: 32
      pe_circuit_class: balanced_logic
      ops_per_tile_per_clock:
        bf16: 1024.0
        fp16: 1024.0
        fp32: 512.0
        int8: 2048.0
      schedule_class: output_stationary
      pipeline_fill_cycles: 32
      pipeline_drain_cycles: 32
      notes: ''
    - tile_type: Matrix
      num_tiles: 13
      pe_array_rows: 32
      pe_array_cols: 32
      pe_circuit_class: hp_logic
      ops_per_tile_per_clock:
        int8: 2048.0
        bf16: 1024.0
        fp16: 1024.0
      schedule_class: output_stationary
      pipeline_fill_cycles: 32
      pipeline_drain_cycles: 32
      notes: ''
    noc:
      topology: mesh_2d
      mesh_rows: 16
      mesh_cols: 8
      flit_bytes: 16
      router_circuit_class: hp_logic
      bisection_bandwidth_gbps: 128.0
    memory:
      memory_type: lpddr5x
      memory_size_gb: 16.0
      memory_bus_bits: 128
      memory_bandwidth_gbps: 136.0
      memory_controllers: 8
      l3_kib_per_tile: 256
      l2_kib_per_tile: 32
      l1_kib_per_tile: 4
    # Default per-cluster DVFS partition (graphs#268 F2): one domain per
    # k x k block of compute sites with its own rail and PLL, plus the
    # uncore. No operating points: every cluster runs at its profile's
    # Vdd and clock, so TDP, performance and area are unchanged.
    power_domains:
    - domain_id: c_0_0
      kind: cluster
      site_ranges:
      - {row_min: 0, row_max: 3, col_min: 0, col_max: 3}
      rail_id: vdd_c_0_0
      clock_domain_id: clk_c_0_0
    - domain_id: c_0_1
      kind: cluster
      site_ranges:
      - {row_min: 0, row_max: 3, col_min: 4, col_max: 7}
      rail_id: vdd_c_0_1
      clock_domain_id: clk_c_0_1
    - domain_id: c_1_0
      kind: cluster
      site_ranges:
      - {row_min: 4, row_max: 7, col_min: 0, col_max: 3}
      rail_id: vdd_c_1_0
      clock_domain_id: clk_c_1_0
    - domain_id: c_1_1
      kind: cluster
      site_ranges:
      - {row_min: 4, row_max: 7, col_min: 4, col_max: 7}
      rail_id: vdd_c_1_1
      clock_domain_id: clk_c_1_1
    - domain_id: c_2_0
      kind: cluster
      site_ranges:
      - {row_min: 8, row_max: 11, col_min: 0, col_max: 3}
      rail_id: vdd_c_2_0
      clock_domain_id: clk_c_2_0
    - domain_id: c_2_1
      kind: cluster
      site_ranges:
      - {row_min: 8, row_max: 11, col_min: 4, col_max: 7}
      rail_id: vdd_c_2_1
      clock_domain_id: clk_c_2_1
    - domain_id: c_3_0
      kind: cluster
      site_ranges:
      - {row_min: 12, row_max: 15, col_min: 0, col_max: 3}
      rail_id: vdd_c_3_0
      clock_domain_id: clk_c_3_0
    - domain_id: c_3_1
      kind: cluster
      site_ranges:
      - {row_min: 12, row_max: 15, col_min: 4, col_max: 7}
      rail_id: vdd_c_3_1
      clock_domain_id: clk_c_3_1
    - domain_id: uncore
      kind: uncore
      members: [memory_phys, io_pads, control_logic]
      rail_id: vdd_uncore
      clock_domain_id: clk_uncore
  interconnects: []
performance:
  int8_tops: 157.3
  bf16_tflops: 78.6
  fp32_tflops: 7.99
  int4_tops: 218.7
power:
  tdp_watts: 11.0
  max_power_watts: 16.8
  min_power_watts: 5.2
  idle_power_watts: 0.58
  default_thermal_profile: default
  thermal_profiles:
  - name: lp
    tdp_watts: 5.2
    clock_mhz: 450.0
    cooling_solution_id: passive_heatsink_large
    efficiency_factor_by_precision:
      int8: 0.73
      bf16: 0.68
      int4: 0.78
    tile_utilization_by_precision:
      int8: 0.95
      bf16: 0.9
      int4: 0.97
    vdd_v: 0.5
  - name: default
    tdp_watts: 11.0
    clock_mhz: 600.0
    cooling_solution_id: active_fan
    efficiency_factor_by_precision:
      int8: 0.73
      bf16: 0.68
      int4: 0.78
    tile_utilization_by_precision:
      int8: 0.95
      bf16: 0.9
      int4: 0.97
    vdd_v: 0.65
  - name: boost
    tdp_watts: 16.8
    clock_mhz: 700.0
    cooling_solution_id: active_fan
    efficiency_factor_by_precision:
      int8: 0.73
      bf16: 0.68
      int4: 0.78
    tile_utilization_by_precision:
      int8: 0.95
      bf16: 0.9
      int4: 0.97
    vdd_v: 0.75
market:
  target_market: embodied
  product_family: Stillwater KPU
  model_tier: mid
  is_available: false
confidence: theoretical
notes: Tile-count sweep at GF 12FDX, lpddr5x x8, 32x32 PE arrays. Same (clock, Vdd) operating
  points as the rest of the sweep so derived TDP scales purely with chip size.
