      mesh_rows: 32
      mesh_cols: 16
      flit_bytes: 16
      router_circuit_class: hp_logic
      bisection_bandwidth_gbps: 256.0
    memory:
      memory_type: lpddr5x
      memory_size_gb: 64.0
      memory_bus_bits: 512
      memory_bandwidth_gbps: 544.0
      memory_controllers: 32
      l3_kib_per_tile: 256
      l2_kib_per_tile: 32
      l1_kib_per_tile: 4
    # Default per-cluster DVFS partition (graphs#268 F2): one domain per
    # k x k block of compute sites with its own rail and PLL, plus the
    # uncore. No operating points: every cluster runs at its profile's
