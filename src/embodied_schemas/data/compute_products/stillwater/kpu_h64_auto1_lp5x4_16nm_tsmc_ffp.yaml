notes: 'Reference heterogeneous KPU for embodied autonomy: a PE fabric of three datapath
  classes, a weight-stationary systolic array for dense GEMM and convolution, and
  an ISP -> SGM -> VIO fixed-function chain. Every tile class comes from the embodied-schemas
  tile-class library; the SKU only states how many of each and where they sit.'
