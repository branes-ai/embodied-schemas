id: kpu_t128_32x32_lp5x8_16nm_tsmc_ffp
name: Stillwater KPU-T128
vendor: stillwater
kind: chip
packaging:
  kind: monolithic
  num_dies: 1
  package_type: monolithic
lifecycle: production
dies:
- die_id: kpu_compute
  die_role: compute
  process_node_id: tsmc_n16
  die_size_mm2: 96.0
  transistors_billion: 3.22
  silicon_bin:
    blocks:
    - name: pe_int8
      circuit_class: balanced_logic
      transistor_source:
        kind: per_pe
        per_unit_mtx: 0.006
        count_ref: tile.INT8-primary
      notes: ''
    - name: pe_bf16
      circuit_class: balanced_logic
      transistor_source:
        kind: per_pe
        per_unit_mtx: 0.012
        count_ref: tile.BF16-primary
      notes: ''
    - name: pe_matrix
      circuit_class: hp_logic
      transistor_source:
        kind: per_pe
        per_unit_mtx: 0.02
        count_ref: tile.Matrix
      notes: ''
    - name: l1_sram
      circuit_class: sram_hd
      transistor_source:
        kind: per_kib
        per_unit_mtx: 0.052
        count_ref: l1_total_kib
      notes: Fabric-edge stream storage, per compute tile
    - name: l2_sram
      circuit_class: sram_hd
      transistor_source:
        kind: per_kib
        per_unit_mtx: 0.052
        count_ref: l2_total_kib
      notes: ''
    - name: l3_sram
      circuit_class: sram_hd
      transistor_source:
        kind: per_kib
        per_unit_mtx: 0.052
        count_ref: l3_total_kib
      notes: ''
    - name: noc_routers
      circuit_class: hp_logic
      transistor_source:
        kind: per_router
        per_unit_mtx: 0.8
        count_ref: noc
      notes: ''
    - name: memory_phys
      circuit_class: analog
      transistor_source:
        kind: per_controller
        per_unit_mtx: 6.0
        count_ref: memory
      notes: ''
    - name: io_pads
      circuit_class: io
      transistor_source:
        kind: fixed
        mtx: 6.0
      notes: ''
    - name: control_logic
      circuit_class: balanced_logic
      transistor_source:
        kind: fixed
        mtx: 12.0
      notes: ''
  clocks:
    base_clock_mhz: 350.0
    boost_clock_mhz: 600.0
  blocks:
  - kind: kpu
    total_tiles: 128
    multi_precision_alu:
    - int4
    - int8
    - bf16
    - fp32
    tiles:
    - tile_type: INT8-primary
      num_tiles: 89
      pe_array_rows: 32
      pe_array_cols: 32
      pe_circuit_class: balanced_logic
      ops_per_tile_per_clock:
        int8: 2048.0
        int4: 4096.0
        bf16: 1024.0
        fp16: 1024.0
      schedule_class: output_stationary
      pipeline_fill_cycles: 32
      pipeline_drain_cycles: 32
      notes: ''
    - tile_type: BF16-primary
      num_tiles: 26
      pe_array_rows: 32
      pe_array_cols: 32
      pe_circuit_class: balanced_logic
      ops_per_tile_per_clock:
        bf16: 1024.0
        fp16: 1024.0
        fp32: 512.0
        int8: 2048.0
      schedule_class: output_stationary
      pipeline_fill_cycles: 32
      pipeline_drain_cycles: 32
      notes: ''
    - tile_type: Matrix
      num_tiles: 13
      pe_array_rows: 32
      pe_array_cols: 32
      pe_circuit_class: hp_logic
      ops_per_tile_per_clock:
        int8: 2048.0
        bf16: 1024.0
        fp16: 1024.0
      schedule_class: output_stationary
      pipeline_fill_cycles: 32
      pipeline_drain_cycles: 32
      notes: ''
    noc:
      topology: mesh_2d
      mesh_rows: 16
      mesh_cols: 8
      flit_bytes: 16
      router_circuit_class: hp_logic
      bisection_bandwidth_gbps: 96.0
    memory:
      memory_type: lpddr5
      memory_size_gb: 16.0
      memory_bus_bits: 128
      memory_bandwidth_gbps: 96.0
      memory_controllers: 8
      l3_kib_per_tile: 256
      l2_kib_per_tile: 32
      l1_kib_per_tile: 4
    # Default per-cluster DVFS partition (graphs#268 F2): one domain per
    # k x k block of compute sites with its own rail and PLL, plus the
    # uncore. No operating points: every cluster runs at its profile's
    # Vdd and clock, so TDP, performance and area are unchanged.
    power_domains:
    - domain_id: c_0_0
      kind: cluster
      site_ranges:
      - {row_min: 0, row_max: 3, col_min: 0, col_max: 3}
      rail_id: vdd_c_0_0
      clock_domain_id: clk_c_0_0
    - domain_id: c_0_1
      kind: cluster
      site_ranges:
      - {row_min: 0, row_max: 3, col_min: 4, col_max: 7}
      rail_id: vdd_c_0_1
      clock_domain_id: clk_c_0_1
    - domain_id: c_1_0
      kind: cluster
      site_ranges:
      - {row_min: 4, row_max: 7, col_min: 0, col_max: 3}
      rail_id: vdd_c_1_0
      clock_domain_id: clk_c_1_0
    - domain_id: c_1_1
      kind: cluster
      site_ranges:
      - {row_min: 4, row_max: 7, col_min: 4, col_max: 7}
      rail_id: vdd_c_1_1
      clock_domain_id: clk_c_1_1
    - domain_id: c_2_0
      kind: cluster
      site_ranges:
      - {row_min: 8, row_max: 11, col_min: 0, col_max: 3}
      rail_id: vdd_c_2_0
      clock_domain_id: clk_c_2_0
    - domain_id: c_2_1
      kind: cluster
      site_ranges:
      - {row_min: 8, row_max: 11, col_min: 4, col_max: 7}
      rail_id: vdd_c_2_1
      clock_domain_id: clk_c_2_1
    - domain_id: c_3_0
      kind: cluster
      site_ranges:
      - {row_min: 12, row_max: 15, col_min: 0, col_max: 3}
      rail_id: vdd_c_3_0
      clock_domain_id: clk_c_3_0
    - domain_id: c_3_1
      kind: cluster
      site_ranges:
      - {row_min: 12, row_max: 15, col_min: 4, col_max: 7}
      rail_id: vdd_c_3_1
      clock_domain_id: clk_c_3_1
    - domain_id: uncore
      kind: uncore
      members: [memory_phys, io_pads, control_logic]
      rail_id: vdd_uncore
      clock_domain_id: clk_uncore
  interconnects: []
performance:
  int8_tops: 124.5
  bf16_tflops: 62.3
  fp32_tflops: 6.32
  int4_tops: 173.2
power:
  tdp_watts: 12.0
  max_power_watts: 18.0
  min_power_watts: 6.0
  idle_power_watts: 0.9
  default_thermal_profile: 12W
  thermal_profiles:
  - name: 6W
    tdp_watts: 6.0
    clock_mhz: 350.0
    cooling_solution_id: passive_heatsink_large
    efficiency_factor_by_precision:
      int8: 0.63
      bf16: 0.58
      int4: 0.68
    tile_utilization_by_precision:
      int8: 0.91
      bf16: 0.86
      int4: 0.93
    vdd_v: 0.634
  - name: 12W
    tdp_watts: 12.0
    clock_mhz: 475.0
    cooling_solution_id: passive_heatsink_large
    efficiency_factor_by_precision:
      int8: 0.68
      bf16: 0.63
      int4: 0.73
    tile_utilization_by_precision:
      int8: 0.94
      bf16: 0.89
      int4: 0.96
    vdd_v: 0.756
  - name: 18W
    tdp_watts: 18.0
    clock_mhz: 500.0
    cooling_solution_id: active_fan
    efficiency_factor_by_precision:
      int8: 0.72
      bf16: 0.67
      int4: 0.77
    tile_utilization_by_precision:
      int8: 0.96
      bf16: 0.91
      int4: 0.97
    vdd_v: 0.886
market:
  launch_date: 2026-Q1
  target_market: embodied
  product_family: Stillwater KPU
  model_tier: mid
  is_available: false
confidence: theoretical
notes: 'Mid-range KPU SKU. M0.5 inverse-scaling: T128 keeps 32x32 PE arrays for

  more total PEs (131K) than T256''s 20x20 layout (102K). 70/20/10 tile

  mix. Targets autonomous robots, advanced edge AI applications. TSMC N16,

  12W default with 6W and 18W profiles.

  '
